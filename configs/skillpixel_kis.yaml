project: skillpixel_kis
dataset_id: skillpixel-local
raw_input: ${SKILLPIXEL_RAW_INPUT}
questions: ${SKILLPIXEL_QUESTIONS}
corpus: ${SKILLPIXEL_CORPUS}
run_root: ${SKILLPIXEL_RUN_ROOT:-artifacts/skillpixel-kis-sota/runs/local}
index_dir: ${SKILLPIXEL_INDEX_DIR:-}
stride_frames: 10
provider: ${SKILLPIXEL_PROVIDER:-siglip2}
model_id: ${SKILLPIXEL_MODEL_ID:-V1}
model_path: ${SKILLPIXEL_MODEL_PATH:-google/siglip2-base-patch16-224}
revision: ${SKILLPIXEL_MODEL_REVISION:-}
device: ${SKILLPIXEL_DEVICE:-cpu}
batch_size: 32
local_files_only: ${SKILLPIXEL_LOCAL_FILES_ONLY:-true}
allow_model_download: ${SKILLPIXEL_ALLOW_MODEL_DOWNLOAD:-false}
ocr_model_version: ${SKILLPIXEL_OCR_MODEL_VERSION:-PP-OCRv6}
ocr_model_path: ${SKILLPIXEL_OCR_MODEL_PATH:-}
ocr_batch_size: 1
object_model: ${SKILLPIXEL_OBJECT_MODEL:-yolo11n.pt}
object_model_path: ${SKILLPIXEL_OBJECT_MODEL_PATH:-}
object_confidence: 0.25
object_batch_size: ${SKILLPIXEL_OBJECT_BATCH_SIZE:-8}
asr_model: ${SKILLPIXEL_ASR_MODEL:-small}
asr_model_path: ${SKILLPIXEL_ASR_MODEL_PATH:-}
asr_compute_type: ${SKILLPIXEL_ASR_COMPUTE_TYPE:-int8}
enable_asr_runtime: ${SKILLPIXEL_ENABLE_ASR_RUNTIME:-false}
fusion_method: ${SKILLPIXEL_FUSION_METHOD:-rrf}
fusion_rank_constant: 60
candidate_multiplier: 5
max_per_video: 5
reranker: ${SKILLPIXEL_RERANKER:-bounded-v1}
reranker_model: ${SKILLPIXEL_RERANKER_MODEL:-cross-encoder/ms-marco-MiniLM-L-6-v2}
reranker_model_path: ${SKILLPIXEL_RERANKER_MODEL_PATH:-}
reranker_batch_size: ${SKILLPIXEL_RERANKER_BATCH_SIZE:-16}
reranker_max_length: 256
rerank_timeout_ms: ${SKILLPIXEL_RERANK_TIMEOUT_MS:-50}
fusion_weights:
  visual: 1.0
  ocr: 1.0
  object: 1.0
  asr: 1.0
